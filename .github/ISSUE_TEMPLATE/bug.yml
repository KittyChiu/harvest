name: Bug report
description: Report a reproducible problem with a Harvest plugin or skill.
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - create-domain-moc
        - create-atomic-note
        - create-coaching-note
        - create-obsidian-marp-slides
        - Marketplace or installation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin and Copilot CLI versions
      placeholder: "Plugin 1.0.0; Copilot CLI 1.0.79"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe example that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your operating system and relevant configuration. Remove secrets and personal data.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed credentials, private source material, and personal data.
          required: true
